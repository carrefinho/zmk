# SCI Host Support lives on feature page 1.
CONFIG_BT_LE_MAX_LOCAL_SUPPORTED_FEATURE_PAGE=1

# ZMK forces ZMK_LOG_LEVEL=4 (DBG) unless ZMK_LOGGING_MINIMAL is set, which
# floods the USB-CDC log backend ("dropped ---") with a per-input-event message
# and steals CPU from HID at 1000 Hz. MINIMAL drops the forced DBG (back to INF),
# killing the per-event <dbg> spam while keeping "link now at 1250 us".
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_ZMK_LOG_LEVEL_INF=y

# USB-only dongle: don't advertise the HID profile over BLE. BLE is still used
# for the split link (central role); this just stops the radio from spending
# time advertising a HID profile to hosts -- freeing radio for the 1.25 ms link.
CONFIG_ZMK_BLE_HID_ADVERTISING=n

# Per-second count of mouse reports actually sent to the host (confirms the
# end-to-end host report rate vs the split event rate).
CONFIG_ZMK_HID_REPORT_RATE_STATS=y
