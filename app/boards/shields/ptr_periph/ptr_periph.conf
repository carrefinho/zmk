# SCI Host Support lives on feature page 1; advertise it so the central may
# initiate the Connection Rate Update procedure against us.
CONFIG_BT_LE_MAX_LOCAL_SUPPORTED_FEATURE_PAGE=1

# ZMK forces ZMK_LOG_LEVEL=4 (DBG) unless ZMK_LOGGING_MINIMAL is set; drop the
# forced DBG (back to INF) to suppress the per-input-event <dbg> spam.
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_ZMK_LOG_LEVEL_INF=y

# Bottleneck probe: per-second split-TX forwarded/dropped/sent counts.
CONFIG_ZMK_SPLIT_PERIPHERAL_STATS=y

# Log over RTT (J-Link) in addition to the VCOM UART. RTT is a RAM memcpy, so it
# won't perturb the 1.25 ms timing even at high rates.
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
