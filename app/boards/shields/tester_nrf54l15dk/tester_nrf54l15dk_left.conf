# Bench-test subrating timing on the central: go idle 10s after the last
# keypress, then drop to the dormant tier 30s after entering idle. (Set here
# rather than in Kconfig.defconfig because both symbols carry an explicit
# default in their own definition, which a Kconfig.defconfig default can't
# override; an explicit .conf value can.)
CONFIG_ZMK_IDLE_TIMEOUT=10000
CONFIG_ZMK_SPLIT_BLE_SUBRATE_DORMANT_DELAY=30000

# Host link (central <-> macOS): request a fixed 15ms interval (12 units), not
# 7.5ms. macOS silently rejects a 7.5ms (interval 6) request and re-imposes its
# own params with latency 0, pinning the host link at 15ms/latency-0 (high
# power). Requesting 15ms up front (Apple's minimum) is accepted as-is, so the
# latency-30 survives -> ~465ms effective host interval.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
